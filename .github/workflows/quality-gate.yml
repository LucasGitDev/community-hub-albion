name: quality-gate

# Cada job chama o mesmo script usado localmente (pnpm quality).
# Thresholds: quality.config.json

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: ${{ matrix.check }}
    runs-on: ubuntu-latest
    # Postgres real para os testes de integração do @albion-hub/db (roda em toda a matriz por simplicidade;
    # só o check coverage usa). Sem URL no CI, o teste falha em vez de ser pulado.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: albion
          POSTGRES_PASSWORD: albion
          POSTGRES_DB: albion_hub_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U albion -d albion_hub_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      TEST_DATABASE_URL: postgres://albion:albion@localhost:5432/albion_hub_test
    strategy:
      fail-fast: false
      matrix:
        check: [lint, typecheck, coverage, duplication, deadcode, audit]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: node scripts/quality-gate.mjs run ${{ matrix.check }}
      # path único: artifact extrai plano em .quality/ no job summary
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-${{ matrix.check }}
          path: .quality/${{ matrix.check }}.json
          if-no-files-found: ignore
      - if: always() && matrix.check == 'coverage'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage
          if-no-files-found: ignore

  e2e:
    runs-on: ubuntu-latest
    # Login real no painel (TASK-010) exige sessão no Postgres.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: albion
          POSTGRES_PASSWORD: albion
          POSTGRES_DB: albion_hub_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U albion -d albion_hub_e2e"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      TEST_DATABASE_URL: postgres://albion:albion@localhost:5432/albion_hub_e2e
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm exec playwright install --with-deps chromium
      - run: node scripts/quality-gate.mjs run e2e
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-e2e
          path: .quality/e2e.json
          if-no-files-found: ignore
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 14
          if-no-files-found: ignore

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: node scripts/quality-gate.mjs run image
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-image
          path: .quality/image.json
          if-no-files-found: ignore

  summary:
    needs: [check, e2e, image]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: quality-*
          path: .quality
          merge-multiple: true
      - id: gate
        shell: bash
        run: |
          set +e
          node scripts/quality-gate.mjs summary
          echo "exit=$?" >> "$GITHUB_OUTPUT"
          cat .quality/summary.md >> "$GITHUB_STEP_SUMMARY"
      - if: github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: quality-gate
          path: .quality/summary.md
      - if: steps.gate.outputs.exit != '0'
        run: exit 1

  # CD: só depois do gate verde, em push na main. Easypanel puxa a imagem do Docker Hub.
  publish:
    needs: [summary]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.summary.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      DOCKERHUB_IMAGE: ${{ vars.DOCKERHUB_IMAGE }}
    steps:
      # Sem secrets/variable, avisa e pula (não deixa a main vermelha antes da configuração).
      - name: Verifica configuração do Docker Hub
        id: config
        shell: bash
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          missing=()
          [ -z "$DOCKERHUB_USERNAME" ] && missing+=("secret DOCKERHUB_USERNAME")
          [ -z "$DOCKERHUB_TOKEN" ] && missing+=("secret DOCKERHUB_TOKEN")
          [ -z "$DOCKERHUB_IMAGE" ] && missing+=("variable DOCKERHUB_IMAGE (ex: usuario/albion-hub)")
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::warning::Publicação pulada. Configure em Settings > Secrets and variables > Actions: ${missing[*]}"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.config.outputs.ready == 'true'
      - uses: docker/setup-buildx-action@v3
        if: steps.config.outputs.ready == 'true'
      - uses: docker/login-action@v3
        if: steps.config.outputs.ready == 'true'
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - id: meta
        if: steps.config.outputs.ready == 'true'
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKERHUB_IMAGE }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-,format=short
      - uses: docker/build-push-action@v6
        if: steps.config.outputs.ready == 'true'
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # Opcional: dispara o deploy no Easypanel (Deploy Webhook do serviço).
      - name: Deploy no Easypanel
        if: steps.config.outputs.ready == 'true'
        shell: bash
        env:
          EASYPANEL_DEPLOY_WEBHOOK: ${{ secrets.EASYPANEL_DEPLOY_WEBHOOK }}
        run: |
          if [ -z "$EASYPANEL_DEPLOY_WEBHOOK" ]; then
            echo "EASYPANEL_DEPLOY_WEBHOOK não configurado; pulei o deploy automático."
            exit 0
          fi
          curl -fsS -X POST "$EASYPANEL_DEPLOY_WEBHOOK" > /dev/null
          echo "Deploy disparado no Easypanel."

