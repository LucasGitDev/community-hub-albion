name: quality-gate

# Cada job chama o mesmo script usado localmente (pnpm quality).
# Thresholds: quality.config.json

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    # Commit só de backlog (task, doc, decisão) não muda comportamento nenhum: não roda gate nem
    # dispara deploy. Vale só no push; em PR o gate roda sempre, senão o check obrigatório `summary`
    # nunca reportaria e o PR ficaria travado para sempre.
    paths-ignore: ['.backlog/**']

permissions:
  contents: read
  pull-requests: write
  statuses: write

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # PR do próprio repositório é validado pelo gate local, que publica o status `summary`
    # (ver scripts/local-pipeline.mjs). Aqui roda o que precisa de ambiente neutro: push na main
    # (verificação independente depois do merge) e PR de fork (código de fora, nunca na máquina de ninguém).
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    name: ${{ matrix.check }}
    runs-on: ubuntu-latest
    # Postgres real para os testes de integração do @albion-hub/db (roda em toda a matriz por simplicidade;
    # só o check coverage usa). Sem URL no CI, o teste falha em vez de ser pulado.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: albion
          POSTGRES_PASSWORD: albion
          POSTGRES_DB: albion_hub_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U albion -d albion_hub_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      TEST_DATABASE_URL: postgres://albion:albion@localhost:5432/albion_hub_test
    strategy:
      fail-fast: false
      matrix:
        check: [lint, typecheck, coverage, duplication, deadcode, audit]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: node scripts/quality-gate.mjs run ${{ matrix.check }}
      # path único: artifact extrai plano em .quality/ no job summary
      - if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: quality-${{ matrix.check }}
          path: .quality/${{ matrix.check }}.json
          if-no-files-found: ignore
      - if: always() && matrix.check == 'coverage'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage
          if-no-files-found: ignore

  e2e:
    # PR do próprio repositório é validado pelo gate local, que publica o status `summary`
    # (ver scripts/local-pipeline.mjs). Aqui roda o que precisa de ambiente neutro: push na main
    # (verificação independente depois do merge) e PR de fork (código de fora, nunca na máquina de ninguém).
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    # Login real no painel (TASK-010) exige sessão no Postgres.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: albion
          POSTGRES_PASSWORD: albion
          POSTGRES_DB: albion_hub_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U albion -d albion_hub_e2e"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      TEST_DATABASE_URL: postgres://albion:albion@localhost:5432/albion_hub_e2e
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm exec playwright install --with-deps chromium
      - run: node scripts/quality-gate.mjs run e2e
      - if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: quality-e2e
          path: .quality/e2e.json
          if-no-files-found: ignore
      # Evidência visual só interessa quando algo quebrou: subir screenshot de rodada verde encheu a cota
      # de artefatos da conta e o 403 do upload derrubava o job (e, com ele, o deploy). `continue-on-error`
      # garante que problema de artefato nunca mais reprove um gate que passou.
      - if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7
          if-no-files-found: ignore

  image:
    # PR do próprio repositório é validado pelo gate local, que publica o status `summary`
    # (ver scripts/local-pipeline.mjs). Aqui roda o que precisa de ambiente neutro: push na main
    # (verificação independente depois do merge) e PR de fork (código de fora, nunca na máquina de ninguém).
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: node scripts/quality-gate.mjs run image
      - if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: quality-image
          path: .quality/image.json
          if-no-files-found: ignore

  # Nome diferente de `summary` de propósito: o check obrigatório do ruleset é o **status** `summary`,
  # publicado no fim deste job ou pelo gate local. Job pulado vira check "skipped", que travaria o PR.
  gate-summary:
    needs: [check, e2e, image]
    if: always() && (github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: quality-*
          path: .quality
          merge-multiple: true
      - id: gate
        shell: bash
        run: |
          set +e
          node scripts/quality-gate.mjs summary
          echo "exit=$?" >> "$GITHUB_OUTPUT"
          cat .quality/summary.md >> "$GITHUB_STEP_SUMMARY"
      - if: github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: quality-gate
          path: .quality/summary.md
      - name: Publica o status `summary`
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          STATE: ${{ steps.gate.outputs.exit == '0' && 'success' || 'failure' }}
        run: |
          gh api -X POST "repos/${{ github.repository }}/statuses/$SHA" \
            -f state="$STATE" -f context=summary \
            -f description="quality gate (GitHub Actions)" \
            -f target_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" > /dev/null
      - if: steps.gate.outputs.exit != '0'
        run: exit 1
