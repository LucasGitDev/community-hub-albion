name: quality-gate

# Cada job chama o mesmo script usado localmente (pnpm quality).
# Thresholds: quality.config.json

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: ${{ matrix.check }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        check: [lint, typecheck, coverage, duplication, deadcode, audit]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: node scripts/quality-gate.mjs run ${{ matrix.check }}
      # path único: artifact extrai plano em .quality/ no job summary
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-${{ matrix.check }}
          path: .quality/${{ matrix.check }}.json
          if-no-files-found: ignore
      - if: always() && matrix.check == 'coverage'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage
          if-no-files-found: ignore

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm exec playwright install --with-deps chromium
      - run: node scripts/quality-gate.mjs run e2e
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-e2e
          path: .quality/e2e.json
          if-no-files-found: ignore
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 14
          if-no-files-found: ignore

  summary:
    needs: [check, e2e]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: quality-*
          path: .quality
          merge-multiple: true
      - id: gate
        shell: bash
        run: |
          set +e
          node scripts/quality-gate.mjs summary
          echo "exit=$?" >> "$GITHUB_OUTPUT"
          cat .quality/summary.md >> "$GITHUB_STEP_SUMMARY"
      - if: github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: quality-gate
          path: .quality/summary.md
      - if: steps.gate.outputs.exit != '0'
        run: exit 1
