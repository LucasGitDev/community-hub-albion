<!doctype html>
<html lang="pt-BR" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#000000" />
    <!-- TASK-071: a identidade do servidor (doc-009). O favicon e a moeda da Toca da Turma, reduzida
         do PNG de 512px versionado em assets/ — o mesmo desenho que o painel usa junto de cada valor. -->
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Toca da Turma</title>
    <meta name="description" content="Painel da Toca da Turma: eventos, carteira, Buffunfa e loja." />
    <!-- TASK-036: tema antes do primeiro paint (padrão escuro). Chave igual a src/lib/theme.ts. -->
    <script>
      try {
        if (localStorage.getItem("albion-hub:theme") === "light") document.documentElement.classList.remove("dark");
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
